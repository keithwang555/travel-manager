name: Sync Itinerary to index.html

on:
  push:
    branches: [main]
    paths:
      - 'data/osaka-doc.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update index.html from Google Doc text
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-itinerary.mjs

      - name: Commit and push updated index.html
        run: |
          if git diff --quiet index.html; then
            echo "No changes to index.html"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: auto-update index.html from Osaka Google Doc"
          git push
